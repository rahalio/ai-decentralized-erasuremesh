apis:
  identity:
    root: src/identity.yaml
  processor-graph:
    root: src/processor-graph.yaml
  erasure-orders:
    root: src/erasure-orders.yaml
  derived-artefacts:
    root: src/derived-artefacts.yaml
  recipient-notices:
    root: src/recipient-notices.yaml
  evidence-packs:
    root: src/evidence-packs.yaml
  exceptions:
    root: src/exceptions.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
