openapi: 3.1.0
info:
  title: Shared primitives
  version: 0.1.0
  description: Prefixed IDs and money types shared across domains.
paths: {}
components:
  schemas:
    TenantId:
      type: string
      description: Prefixed ULID-style tenant identifier.
      pattern: '^tnt_[0-9A-HJKMNP-TV-Z]{26}$'
      example: tnt_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    UserId:
      type: string
      description: Prefixed ULID-style tenant operator user identifier.
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      example: usr_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    Currency:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: USD
    Money:
      type: object
      description: Decimal-string amount + currency (never IEEE float).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Signed decimal string with up to 5 fractional digits.
          pattern: '^-?\d+(\.\d{1,5})?$'
          example: "1234.56"
        currency:
          $ref: '#/components/schemas/Currency'
    JobStatus:
      type: string
      description: Generic async job lifecycle.
      enum:
        - queued
        - running
        - done
        - failed
    ProcessorNodeId:
      type: string
      description: Prefixed processor-graph node id.
      pattern: '^pnd_[0-9A-HJKMNP-TV-Z]{26}$'
    GraphEdgeId:
      type: string
      description: Prefixed processor-graph edge id.
      pattern: '^ged_[0-9A-HJKMNP-TV-Z]{26}$'
    ErasureOrderId:
      type: string
      description: Prefixed erasure order id.
      pattern: '^eor_[0-9A-HJKMNP-TV-Z]{26}$'
    ErasureTaskId:
      type: string
      description: Prefixed erasure task id.
      pattern: '^etk_[0-9A-HJKMNP-TV-Z]{26}$'
    DerivedArtefactId:
      type: string
      description: Prefixed derived-artefact id.
      pattern: '^dar_[0-9A-HJKMNP-TV-Z]{26}$'
    RecipientNoticeId:
      type: string
      description: Prefixed recipient-notice id.
      pattern: '^rcn_[0-9A-HJKMNP-TV-Z]{26}$'
    EvidencePackId:
      type: string
      description: Prefixed evidence-pack id.
      pattern: '^evp_[0-9A-HJKMNP-TV-Z]{26}$'
    ExceptionRecordId:
      type: string
      description: Prefixed exception-record id.
      pattern: '^exc_[0-9A-HJKMNP-TV-Z]{26}$'
